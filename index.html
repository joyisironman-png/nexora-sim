function validateLogin(roll,email){
  const r=roll.trim().toUpperCase();
  const e=email.trim().toLowerCase();
  if(r.startsWith(NEXORA_PREFIX)){return{valid:true,isNexora:true};}
  if(!WHITELIST.includes(r)){return{valid:false,reason:'Your roll number ('+roll+') is not on the participant list. Contact Team NEXORA immediately.'};}

  return{valid:true,isNexora:false};

function calcY1Return(sid){
  const invested=S.topAlloc[sid]||0;
  if(!invested)return null;
  const expenses=S.expenses[sid]||{};
  const totalExp=Object.values(expenses).reduce((a,b)=>a+b,0);
  const outcome=Y1_OUTCOMES[sid];
  if(!totalExp)return{invested,returned:Math.round(invested*outcome.base_mult*0.5),profit:0,isGood:false,narrative:outcome.bad};
  const domainSpend={};DOMAINS.forEach(d=>domainSpend[d]=0);
  Object.entries(expenses).forEach(([eid,amt])=>{const exp=EXPENSES.find(e=>e.id===eid);if(exp)domainSpend[exp.domain]=(domainSpend[exp.domain]||0)+amt;});
  const goodTotal=outcome.good_domains.reduce((a,d)=>a+(domainSpend[d]||0),0);
  const goodRatio=totalExp>0?goodTotal/totalExp:0;
  const isGood=goodRatio>=0.38;
  const mult=isGood?outcome.base_mult+(outcome.max_mult-outcome.base_mult)*Math.min(1,goodRatio*1.4):outcome.base_mult*(0.25+goodRatio*0.6);
  const returned=Math.round(invested*mult);
  return{invested,returned,profit:returned-invested,isGood,narrative:isGood?outcome.good:outcome.bad};
}

function calcY2Budget(){
  const totalAllocated=Object.values(S.topAlloc).reduce((a,b)=>a+b,0);
  const overheads=S.researchSpent+(S.extensionCost||0);
  const unallocated=Math.max(0,BUDGET_Y1-overheads-totalAllocated);
  let netPL=0;
  STARTUPS.forEach(s=>{const r=calcY1Return(s.id);if(r)netPL+=(r.returned-r.invested);});
  return Math.max(0,BUDGET_Y2_BASE+unallocated+netPL);
}

let timerInt=null;
function getRem(){if(!S.timerEndTime)return S.timerTotalSeconds;const rem=Math.floor((S.timerEndTime-Date.now())/1000);return Math.max(0,Math.min(rem,S.timerTotalSeconds));}
function fmtTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}

function startCountdown(){
  if(timerInt)clearInterval(timerInt);
  const tb=$('timer-bar');if(tb)tb.style.display='block';
  timerInt=setInterval(()=>{
    const rem=getRem();
    const td=$('timer-display');if(td)td.textContent=fmtTime(rem);
    const tb2=$('timer-bar');
    if(tb2){if(rem<300)tb2.classList.add('urgent');else tb2.classList.remove('urgent');}
    if(rem<=0){clearInterval(timerInt);save(S.phase_completed||1);go('timesup');}
  },1000);
  const td=$('timer-display');if(td)td.textContent=fmtTime(getRem());
}

function getInvestable(){return BUDGET_Y1-S.researchSpent-(S.extensionCost||0);}

window.updTopAlloc=function(sid,v){

};
window.updY2Alloc=function(sid,v,y2budget){

function drawR1Detail(){

  html+='</div>';
  if(allDiags){
    html+='<div class="card" style="margin-bottom:1rem">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">'+
    '<h2>Expense planning</h2>'+
    '<span style="font-weight:700;color:'+(over?'#DC2626':expSpent===alloc?'#059669':'#4F46E5')+'">'+fmt(expSpent)+' / '+fmt(alloc)+'</span></div>'+
    '<div class="bb"><div class="bf '+(over?'over':expSpent===alloc?'full':'')+'" id="ebar" style="width:'+pct+'%"></div></div>'+
    '<div style="display:flex;justify-content:space-between;margin-bottom:.75rem;margin-top:4px">'+

function buildExpGrid(sid){
  const exps=S.expenses[sid]||{};let html='';
  DOMAINS.forEach(domain=>{
    const items=EXPENSES.filter(e=>e.domain===domain);
    html+='<div class="domain-hd">'+domain+'</div>';

      '<div style="display:flex;align-items:center;gap:4px;flex-shrink:0"><input type="number" min="0" step=".5" placeholder="0" value="'+(v||'')+'" data-eid="'+e.id+'" onchange="updExp(this.getAttribute(\'data-eid\'),this.value)"><span class="muted" style="font-size:11px">L</span></div></div>';
    });
  });
  return html;

window.setDiag=function(sid,key,val){if(!S.diagnostics[sid])S.diagnostics[sid]={};S.diagnostics[sid][key]=val;saveLocal();drawR1Detail();};
window.updExp=function(eid,v){
  const f=funded();const s=f[S.detailIdx];if(!s)return;
  const sid=s.id;const alloc=S.topAlloc[sid];
  if(!S.expenses[sid])S.expenses[sid]={};
  const val=Math.round(Math.max(0,parseFloat(v)||0)*100000);
  if(val===0)delete S.expenses[sid][eid];else S.expenses[sid][eid]=val;
  const spent=Object.values(S.expenses[sid]).reduce((a,b)=>a+b,0);
  const over=spent>alloc;
  const bar=$('ebar');if(bar){bar.style.width=Math.min(100,spent/alloc*100)+'%';bar.className='bf '+(over?'over':spent===alloc?'full':'');}
  const lbl=$('eleft');if(lbl){lbl.textContent=fmt(Math.abs(alloc-spent))+(over?' over':' remaining');lbl.style.color=over?'#DC2626':'';}
  saveLocal();updateDetBtn(S.detailIdx===funded().length-1,alloc,spent,over);
};
function updateDetBtn(isLast,alloc,spent,over){
  const b=$('dbtn');if(!b)return;
  const ok=!over&&spent>0;
  b.disabled=!ok;
  b.textContent=over?'Over budget — adjust expenses':spent===0?'Allocate to at least one expense':isLast?'Submit Year 1 allocation':'Next venture';
}
window.nextDetail=function(){
  const f=funded();const s=f[S.detailIdx];

};

function drawR3Crisis(){
  const f=funded();let cidx=0;
  const AI_TAUNTS=["Write your reasoning here. ChatGPT is not a co-founder. It has no skin in the game. You do.","Your analysis, not your chatbot's. We can tell the difference — and so can you.","Type your actual thinking. AI-written rationale sounds like a case study with no courage in it.","Surprise us with a thought we haven't read in a BCG article. Your brain, not the cloud's.","Write like the Rs.10 Cr is real. Because for this exercise, it is. No language model has stakes."];
  function draw(){
    const s=f[cidx];const cr=CRISES[s.id];
    const dec=S.crisisCall[s.id]||{call:'',reason:''};const isLast=cidx===f.length-1;
    const taunt=AI_TAUNTS[cidx%AI_TAUNTS.length];
    let html='<div style="font-size:11px;font-weight:700;color:#DC2626;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem">Crisis '+(cidx+1)+' of '+f.length+'</div>'+
    '<h1 style="margin-bottom:.25rem">'+cr.title+'</h1>'+
    '<div class="card card-hi" style="margin-bottom:1rem"><span class="badge b-blue" style="margin-bottom:.5rem">'+s.name+'</span><p>'+cr.body+'</p></div>'+
    '<div style="margin-bottom:1rem"><label>Your call</label>'+
    '<div class="crisis-opt'+(dec.call==='Pivot'?' sel':'')+'" onclick="setCall(\''+s.id+'\',\'Pivot\')">Pivot — change strategy or direction</div>'+
    '<div class="crisis-opt'+(dec.call==='Double down'?' sel':'')+'" onclick="setCall(\''+s.id+'\',\'Double down\')">Double down — commit harder to the current path</div>'+
    '<div class="crisis-opt'+(dec.call==='Exit'?' sel':'')+'" onclick="setCall(\''+s.id+'\',\'Exit\')">Exit — walk away from this investment</div>'+
    '</div>'+
    '<div style="margin-bottom:1rem">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem">'+
    '<label style="margin:0">Your reasoning (40 words minimum)</label>'+
    '<span class="muted" id="r3wc">'+wc(dec.reason||'')+' / 40</span></div>'+
    '<textarea id="r3rat" rows="4" placeholder="'+taunt+'">'+(dec.reason||'')+'</textarea></div>'+
    '<button id="r3btn" class="btn btn-p btn-w">'+(isLast?'Submit simulation':'Next crisis')+'</button>';
    app().innerHTML=html;
    $('r3rat').oninput=e=>{
      if(!S.crisisCall[s.id])S.crisisCall[s.id]={call:dec.call,reason:''};
      S.crisisCall[s.id].reason=e.target.value;saveLocal();
      const w=wc(e.target.value);const wcel=$('r3wc');
      if(wcel){wcel.textContent=w+' / 40';wcel.style.color=w>=40?'#059669':'#888';}
      updR3Btn();
    };
    function updR3Btn(){
      const d=S.crisisCall[s.id]||{};const w=wc(d.reason||'');const b=$('r3btn');if(!b)return;
      const ok=d.call&&w>=40;b.disabled=!ok;
      b.textContent=!d.call?'Select a call first':w<40?(40-w)+' more words needed':isLast?'Submit simulation':'Next crisis';
    }
    $('r3btn').onclick=()=>{if(cidx<f.length-1){cidx++;draw();}else{save(3);go('done');}};
    window.setCall=(sid,call)=>{if(!S.crisisCall[sid])S.crisisCall[sid]={call:'',reason:''};S.crisisCall[sid].call=call;saveLocal();draw();};
    updR3Btn();
  }
  draw();
}

function buildReportPrompt(){
  const funded=STARTUPS.filter(s=>(S.topAlloc[s.id]||0)>0);
  const ext=(S.timerTotalSeconds-30*60)/60;
  const timeUsed=S.timerTotalSeconds-getRem();
  const DNA={
    tradetab:{Operations:40,HR:40,Finance:10,Marketing:5,Sales:5},
    medilingo:{Finance:35,Operations:35,HR:20,Marketing:5,Sales:5},
    quizforge:{Operations:45,HR:20,Marketing:15,Sales:15,Finance:5},
    trailmate:{Marketing:30,Sales:25,HR:20,Operations:15,Finance:10},
    campuskeep:{Operations:40,Finance:25,HR:15,Marketing:10,Sales:10},
    neuroleap:{HR:35,Finance:20,Operations:25,Marketing:5,Sales:5},
  };
  let prompt=`You are evaluating a candidate's performance in a startup investment simulation for NEXORA, the incubator at XLRI Jamshedpur. Provide a concise, specific evaluation that a panel of MBA faculty can read in 2 minutes per candidate.

CANDIDATE: ${S.user?.name} | ${S.user?.program} | Section ${S.user?.section} | Roll: ${S.user?.roll}
TIME EXTENSION PURCHASED: ${ext>0?ext+' extra minutes at Rs.'+(ext*50)+'L cost':'None (used full 30 min budget)'}
TIME USED: ~${Math.round(timeUsed/60)} of ${S.timerTotalSeconds/60} minutes
FULL BRIEFS PURCHASED (Rs.15L each): ${S.briefsRead.length} of 6 ventures (${S.briefsRead.join(', ')||'none'})

--- YEAR 1 DECISIONS ---
`;
  funded.forEach(s=>{
    const st=STARTUPS.find(x=>x.id===s.id);
    const alloc=S.topAlloc[s.id];
    const expenses=S.expenses[s.id]||{};
    const expTotal=Object.values(expenses).reduce((a,b)=>a+b,0);
    const diags=S.diagnostics[s.id]||{};
    const qs=DIAGNOSTICS[s.id];
    const domainSpend={};DOMAINS.forEach(d=>domainSpend[d]=0);
    Object.entries(expenses).forEach(([eid,amt])=>{const exp=EXPENSES.find(e=>e.id===eid);if(exp)domainSpend[exp.domain]=(domainSpend[exp.domain]||0)+amt;});
    const r=calcY1Return(s.id);
    const idealDNA=DNA[s.id]||{};
    prompt+=`\n${st?.name} (${st?.sector} — ${st?.stage})
  Allocated: ${fmt(alloc)} | Spent on expenses: ${fmt(expTotal)} | Wasted in startup: ${fmt(Math.max(0,alloc-expTotal))}
  Expense breakdown: ${DOMAINS.map(d=>domainSpend[d]>0?d+' '+Math.round(domainSpend[d]/alloc*100)+'%':'').filter(Boolean).join(', ')||'nothing allocated to expenses'}
  Ideal breakdown for this startup: ${Object.entries(idealDNA).map(([d,p])=>d+' '+p+'%').join(', ')}
  Diagnostic answers:`;
    qs.forEach((q,i)=>{prompt+=`\n    Q: ${q.q}\n    A: ${diags['q'+i]||'(not answered)'} [Options were: ${q.opts.join(' / ')}]`;});
    prompt+=`\n  Year 1 outcome: ${r?fmt(r.returned)+' returned on '+fmt(r.invested)+' invested ('+(r.isGood?'GOOD allocation':'POOR allocation')+')':'not funded'}
  Outcome narrative: ${r?.narrative||'N/A'}\n`;
  });

  const y2funded=STARTUPS.filter(s=>(S.y2alloc[s.id]||0)>0);
  prompt+=`\n--- YEAR 2 DECISIONS ---
Y2 Budget: ${fmt(calcY2Budget())}
`;
  y2funded.forEach(s=>{
    const st=STARTUPS.find(x=>x.id===s.id);
    const r2d=S.r2diagnostics[s.id]||{};
    const r2qs=R2_QUESTIONS[s.id];
    prompt+=`\n${st?.name}: Allocated ${fmt(S.y2alloc[s.id]||0)} in Year 2`;
    r2qs.forEach((q,i)=>{prompt+=`\n    Q: ${q.q}\n    A: ${r2d['q'+i]||'(not answered)'}`;});
  });

  prompt+=`\n--- CRISIS DECISIONS ---
`;
  Object.entries(S.crisisCall||{}).forEach(([sid,dec])=>{
    const st=STARTUPS.find(x=>x.id===sid);
    const cr=CRISES[sid];
    prompt+=`\n${st?.name} — "${cr?.title}"
  Crisis: ${cr?.body}
  Call: ${dec.call}
  Reasoning (${wc(dec.reason||'')} words): "${dec.reason||'(empty)'}"
`;
  });

  prompt+=`
--- YOUR EVALUATION TASK ---
Write a structured markdown evaluation with these exact sections:

## Executive Summary
2-3 sentences. Overall strategic quality. Strongest decision. Biggest mistake.

## Portfolio Decisions
For EACH funded startup, one bullet: was the expense allocation strategic or scattered? Did the diagnostic answers show actual understanding? Note any obvious mistakes. Be specific (e.g. "Spent 40% on Marketing for a pre-product startup with no product to market").

## Year 2 Adaptability  
Did they respond intelligently to the Year 1 outcomes? Did losses change their strategy meaningfully?

## Crisis Call Quality
Rate each crisis call (Good/Acceptable/Poor) with one-line reason. Note if reasoning is specific or vague.

## AI Usage Indicator
Flag if any reasoning reads as AI-generated (overly structured, uses MBA jargon without conviction, hits exactly 40 words, generic pros/cons format, lacks any personal voice or original framing). Rate: Likely Original / Possibly AI-Assisted / Likely AI-Generated.

## Scores (out of 10)
- Strategic Thinking: X/10
- Business Understanding: X/10  
- Adaptability: X/10
- Reasoning Quality: X/10
- **Overall: X/10**

## One Line for the Panel
A single memorable sentence about this candidate.

Be direct. Reference specific numbers and decisions from their data. Total length: 450-550 words.`;
  return prompt;
}

async function generateAndSendReport(isTimedOut){
  if(!SHEETS_URL)return;
  // Send final data to Apps Script — Apps Script calls Gemini and creates the Doc
  const u=S.user||{};
  const payload={
    candidate:{name:u.name||'Unknown',roll:u.roll||'Unknown',program:u.program||'',section:u.section||''},
    simulation_data:{top_alloc:S.topAlloc,expenses:S.expenses,diagnostics:S.diagnostics,
      y2alloc:S.y2alloc,r2diagnostics:S.r2diagnostics,crisis_call:S.crisisCall,
      briefs_read:S.briefsRead,research_spent:S.researchSpent,extension_cost:S.extensionCost,
      timed_out:isTimedOut||false},
    report_prompt:buildReportPrompt(isTimedOut),
    phase_completed:3,is_final:true,
    submitted_at:new Date().toISOString()
  };
  const form=new URLSearchParams();
  form.append('data',JSON.stringify(payload));
  try{
    const resp=await fetch(SHEETS_URL,{method:'POST',body:form});
    // For NEXORA: try to show what was sent
    if(S.isNexora){
      const prev=$('nexora-report');
      if(prev){
        prev.style.display='block';
        prev.innerHTML='<div class="card" style="text-align:left;margin-top:1rem"><h2 style="margin-bottom:.5rem">Data sent to Sheets ✓</h2><p style="font-size:12px;color:#555">The Apps Script will call Gemini and create a Google Doc. Check your Google Sheet for the report link in 10-15 seconds.</p><details style="margin-top:.75rem"><summary style="font-size:12px;color:#4F46E5;cursor:pointer">View prompt that was sent to AI</summary><pre style="white-space:pre-wrap;font-size:11px;line-height:1.6;color:#555;background:#F9F9F8;padding:.75rem;border-radius:6px;margin-top:.5rem;overflow:auto;max-height:300px">'+payload.report_prompt+'</pre></details></div>';

      '<b>Y1 diagnostics:</b><br>'+STARTUPS.map(s=>{const d2=(row.diagnostics&&row.diagnostics[s.id])||{};const qs=DIAGNOSTICS[s.id];if(!Object.keys(d2).length)return'';return'<div style="margin:.3rem 0"><b>'+s.name+':</b> '+qs.map((q,i)=>'[Q'+(i+1)+'] '+(d2['q'+i]||'—')).join(' | ')+'</div>';}).join('')+
      '<br><b>Y2 diagnostics:</b><br>'+STARTUPS.map(s=>{const d2=(row.r2diagnostics&&row.r2diagnostics[s.id])||{};const qs=R2_QUESTIONS[s.id];if(!Object.keys(d2).length)return'';return'<div style="margin:.3rem 0"><b>'+s.name+':</b> '+qs.map((q,i)=>'[Q'+(i+1)+'] '+(d2['q'+i]||'—')).join(' | ')+'</div>';}).join('')+
      '<br><b>Expenses:</b><br>'+STARTUPS.map(s=>{const ex=(row.expenses&&row.expenses[s.id])||{};const items=Object.entries(ex).filter(([,v])=>v>0);if(!items.length)return'';return'<div style="margin:.3rem 0"><b>'+s.name+':</b> '+items.map(([eid,amt])=>{const exp=EXPENSES.find(x=>x.id===eid);return(exp?exp.label:eid)+' ('+fmt(amt)+')';}).join(', ')+'</div>';}).join('')+
      '<br><b>Crisis calls:</b><br>'+Object.entries(row.crisis_call||{}).map(([sid,v])=>{const st=STARTUPS.find(x=>x.id===sid);return'<div style="margin:.3rem 0"><b>'+(st?st.name:sid)+' — '+v.call+':</b> '+v.reason+'</div>';}).join('')+
      '</div></details></div>';
    });
    app().innerHTML=html;
  }catch(e){app().innerHTML='<div class="ibox" style="color:#DC2626">Error loading: '+e.message+'</div>';}
}

function render(){
  const s=S.screen;
  if(s==='home')drawHome();
  else if(s==='register')drawRegister();
  else if(s==='timerinfo')drawTimerInfo();
  else if(s==='brief')drawBrief();
  else if(s==='r1alloc')drawR1Alloc();
  else if(s==='r1detail')drawR1Detail();
  else if(s==='r2intro')drawR2Intro();
  else if(s==='r2questions')drawR2Questions();
  else if(s==='r2alloc')drawR2Alloc();
  else if(s==='r3crisis')drawR3Crisis();
  else if(s==='done')drawDone();
  else if(s==='timesup')drawTimesUp();
  else if(s==='adminlogin')drawAdminLogin();
  else if(s==='admin')drawAdmin();
  if(S.roundStarted&&s!=='done'&&s!=='timesup'&&s!=='admin'&&s!=='adminlogin'&&s!=='home'&&s!=='register'&&s!=='timerinfo'){
    const tb=$('timer-bar');if(tb)tb.style.display='block';
    startCountdown();
  } else if(s==='home'||s==='register'||s==='timerinfo'||s==='adminlogin'){
    const tb=$('timer-bar');if(tb)tb.style.display='none';
  }
}

loadLocal();
if(S.roundStarted&&S.screen!=='done'&&S.screen!=='timesup'){const rem=getRem();if(rem<=0){S.screen='timesup';}}
render();
</script>
