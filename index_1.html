async function save(phase) {
  try {
    const p = {name:S.user?.name,roll:S.user?.roll,section:S.user?.section,
      top_alloc:S.topAlloc,diagnostics:S.diagnostics,expenses:S.expenses,
      r2adj:S.r2adj,crisis_call:S.crisisCall,phase_completed:phase};
    if(S.savedId){ await db.from('submissions').update(p).eq('id',S.savedId); }
    else { const {data}=await db.from('submissions').insert(p).select(); if(data&&data[0]&&data[0].id)S.savedId=data[0].id; }
  } catch(e){console.error('Save error:',e);}
}

function buildAllocRows(){

function rebuildAllocSummary(){

    '<select onchange="setDiag(\''+s.id+'\',\'q'+i+'\',this.value)">'+

    '<span class="muted">Enter 0 to skip an expense. Amounts in Lakhs.</span>'+
    '<span class="muted" id="eleft">'+fmt(Math.abs(CTX.alloc-expSpent))+' '+(over?'over':'remaining')+'</span></div>'+
    '<div id="egrid">'+buildExpGrid(s.id)+'</div></div>'+

function buildExpGrid(sid){
  var exps=S.expenses[sid]||{};
  var html='';
  DOMAINS.forEach(function(domain){
    var items=EXPENSES.filter(function(e){return e.domain===domain;});
    html+='<div class="domain-hd">'+domain+'</div>';
    items.forEach(function(e){
      var v=exps[e.id]?exps[e.id]/100000:'';
      html+='<div class="exp-row">'+
      '<div style="flex:1;min-width:0">'+
      '<div class="exp-lbl">'+e.label+'</div>'+
      '<div class="exp-desc">'+e.desc+'</div>'+
      '<div class="exp-cost">Typical cost: '+e.cost+'</div></div>'+
      '<div style="display:flex;align-items:center;gap:4px;flex-shrink:0">'+
      '<input type="number" min="0" step=".5" placeholder="0" value="'+(v||'')+'" data-eid="'+e.id+'" onchange="updExp(this.getAttribute(\'data-eid\'),this.value)">'+
      '<span class="muted" style="font-size:11px">L</span></div></div>';
    });
  });
  return html;
}

window.setDiag=function(sid,key,val){
  if(!S.diagnostics[sid])S.diagnostics[sid]={};
  S.diagnostics[sid][key]=val;
  drawR1Detail();
};
window.updExp=function(eid,v){
  var sid=CTX.sid,alloc=CTX.alloc;
  if(!S.expenses[sid])S.expenses[sid]={};
  var val=Math.round(Math.max(0,parseFloat(v)||0)*100000);
  if(val===0)delete S.expenses[sid][eid]; else S.expenses[sid][eid]=val;
  var spent=Object.values(S.expenses[sid]).reduce(function(a,b){return a+b;},0);
  var over=spent>alloc,pct=Math.min(100,spent/alloc*100);
  var bar=$('ebar');if(bar){bar.style.width=pct+'%';bar.className='bf '+(over?'over':spent===alloc?'full':'');}
  var lbl=$('eleft');if(lbl){lbl.textContent=fmt(Math.abs(alloc-spent))+(over?' over':' remaining');lbl.style.color=over?'#DC2626':'';}
  updateDetBtn(S.detailIdx===funded().length-1,alloc,spent,over);
};
function updateDetBtn(isLast,alloc,spent,over){
  var b=$('dbtn');if(!b)return;
  var ok=!over&&spent>0;
  b.disabled=!ok;
  b.textContent=over?'Over budget - adjust':spent===0?'Allocate to at least one expense':isLast?'Submit Round 1':'Next startup';
}

window.updR2=function(sid,val){
  var v=Math.round(parseFloat(val));S.r2adj[sid]=v;
  var base=S.topAlloc[sid];
  var a=$('r2a-'+sid),d=$('r2d-'+sid);
  if(a){a.textContent=fmt(v);a.style.color=v>base?'#059669':v<base?'#DC2626':'#1a1a1a';}
  if(d){d.textContent=v===base?'unchanged':((v>base?'+':'')+fmt(v-base));}
};

function drawR3Crisis(){
  var f=funded();var cidx=0;
  function draw(){
    var s=f[cidx],cr=CRISES[s.id];
    var dec=S.crisisCall[s.id]||{call:'',reason:''};
    var isLast=cidx===f.length-1;
    var html='<span class="badge b-red" style="margin-bottom:.75rem">Round 3 - Crisis '+(cidx+1)+' of '+f.length+'</span>'+
    '<h1 style="margin-bottom:.25rem">'+cr.title+'</h1>'+
    '<div class="card card-hi" style="margin-bottom:1rem">'+
    '<span class="badge b-blue" style="margin-bottom:.5rem">'+s.name+'</span>'+
    '<p>'+cr.body+'</p></div>'+
    '<div style="margin-bottom:1rem"><label>Your call</label>'+
    '<div class="g3">'+
    '<div class="crisis-opt'+(dec.call==='Pivot'?' sel':'')+'" onclick="setCall(\''+s.id+'\',\'Pivot\')">Pivot</div>'+
    '<div class="crisis-opt'+(dec.call==='Double down'?' sel':'')+'" onclick="setCall(\''+s.id+'\',\'Double down\')">Double down</div>'+
    '<div class="crisis-opt'+(dec.call==='Exit'?' sel':'')+'" onclick="setCall(\''+s.id+'\',\'Exit\')">Exit</div>'+
    '</div></div>'+
    '<div style="margin-bottom:1rem">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem">'+
    '<label style="margin:0">Your reasoning (40 words minimum)</label>'+
    '<span class="muted" id="r3wc">'+wc(dec.reason)+' / 40</span></div>'+
    '<textarea id="r3rat" rows="4" placeholder="Why this call? What are you prioritising? What trade-offs are you accepting?">'+( dec.reason||'')+'</textarea></div>'+
    '<button id="r3btn" class="btn btn-p btn-w">'+(isLast?'Submit final simulation':'Next crisis')+'</button>';
    app().innerHTML=html;
    $('r3rat').oninput=function(e){
      if(!S.crisisCall[s.id])S.crisisCall[s.id]={call:dec.call,reason:''};
      S.crisisCall[s.id].reason=e.target.value;
      var w=wc(e.target.value);
      var wcel=$('r3wc');if(wcel){wcel.textContent=w+' / 40';wcel.style.color=w>=40?'#059669':'#888';}
      updR3Btn();
    };
    function updR3Btn(){
      var d=S.crisisCall[s.id]||{},w=wc(d.reason||'');
      var b=$('r3btn');if(!b)return;
      var ok=d.call&&w>=40;b.disabled=!ok;
      b.textContent=!d.call?'Select a call first':w<40?(40-w)+' more words needed':isLast?'Submit final simulation':'Next crisis';
    }
    $('r3btn').onclick=function(){if(cidx<f.length-1){cidx++;draw();}else{save(3);go('done');}};
    updR3Btn();
  }
  window.setCall=function(sid,call){
    if(!S.crisisCall[sid])S.crisisCall[sid]={call:'',reason:''};
    S.crisisCall[sid].call=call;draw();
  };
  draw();
}

async function drawAdmin(){
  app().innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">'+
  '<h1>Admin Panel</h1>'+
  '<button class="btn btn-g" onclick="go(\'home\')">Back</button></div>'+

  try {
    var result=await db.from('submissions').select('*').order('submitted_at',{ascending:false});
    var data=result.data||[];
    function domainBreakdown(expenses){
      var totals={};
      DOMAINS.forEach(function(d){totals[d]=0;});
      STARTUPS.forEach(function(s){
        var ex=(expenses&&expenses[s.id])||{};
        Object.entries(ex).forEach(function(entry){
          var eid=entry[0],amt=entry[1];
          var exp=EXPENSES.find(function(e){return e.id===eid;});
          if(exp)totals[exp.domain]=(totals[exp.domain]||0)+amt;
        });
      });
      return totals;
    }
    var html='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">'+
    '<h1>Admin Panel</h1><button class="btn btn-g" onclick="go(\'home\')">Back</button></div>'+
    '<div class="card" style="margin-bottom:1rem"><div class="g3">'+
    '<div><label>Total submissions</label><div style="font-size:22px;font-weight:700">'+data.length+'</div></div>'+
    '<div><label>Round 1 complete</label><div style="font-size:22px;font-weight:700">'+data.filter(function(d){return d.phase_completed>=1;}).length+'</div></div>'+
    '<div><label>All 3 rounds done</label><div style="font-size:22px;font-weight:700">'+data.filter(function(d){return d.phase_completed>=3;}).length+'</div></div>'+
    '</div></div>';
    if(data.length===0){html+='<div class="ibox">No submissions yet.</div>';}
    else {
      data.forEach(function(row){
        var db2=domainBreakdown(row.expenses);
        var totalExp=Object.values(db2).reduce(function(a,b){return a+b;},0);
        html+='<div class="card" style="margin-bottom:.75rem">'+
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:.5rem">'+
        '<b>'+row.name+'</b>'+
        '<span class="badge b-blue">'+row.roll+'</span>'+
        '<span class="badge b-amber">Sec '+row.section+'</span>'+
        '<span style="margin-left:auto" class="badge '+(row.phase_completed>=3?'b-green':row.phase_completed>=2?'b-amber':'b-red')+'">Phase '+row.phase_completed+'/3</span>'+
        '</div>'+
        '<div style="margin-bottom:.5rem">'+
        STARTUPS.map(function(s){var a=(row.top_alloc&&row.top_alloc[s.id])||0;return a>0?'<span class="tag"><b>'+s.name+'</b>: '+fmt(a)+'</span>':'';}).join('')+
        '</div>'+
        '<div style="margin-bottom:.75rem">'+
        '<label style="margin-bottom:4px">Expense domain profile</label>'+
        '<div style="display:flex;gap:6px;flex-wrap:wrap">'+
        DOMAINS.map(function(d){
          var amt=db2[d]||0,pct2=totalExp>0?Math.round(amt/totalExp*100):0;
          return pct2>0?'<div style="background:#EEF2FF;border-radius:6px;padding:4px 8px;font-size:11px"><b style="color:#4F46E5">'+d+'</b><br><span style="color:#555">'+pct2+'% ('+fmt(amt)+')</span></div>':'';
        }).join('')+
        '</div></div>'+
        (row.crisis_call?'<div style="margin-bottom:.5rem">'+Object.entries(row.crisis_call).map(function(entry){var sid=entry[0],v=entry[1];var st=STARTUPS.find(function(x){return x.id===sid;});return'<span class="tag"><b>'+(st?st.name:sid)+':</b> '+v.call+'</span>';}).join('')+'</div>':'')+
        '<details><summary style="font-size:12px;cursor:pointer;color:#4F46E5">Full detail view</summary>'+
        '<div style="margin-top:.75rem;font-size:12px;line-height:1.7">'+
        '<b>Diagnostic answers:</b><br>'+
        STARTUPS.map(function(s){
          var d2=(row.diagnostics&&row.diagnostics[s.id])||{};
          var qs=DIAGNOSTICS[s.id];
          if(!Object.keys(d2).length)return'';
          return'<div style="margin:.4rem 0"><b>'+s.name+':</b> '+qs.map(function(q,i){return'['+q.q.substring(0,30)+'...] -> '+(d2['q'+i]||'?');}).join(' | ')+'</div>';
        }).join('')+
        '<br><b>Expenses breakdown:</b><br>'+
        STARTUPS.map(function(s){
          var ex=(row.expenses&&row.expenses[s.id])||{};
          var items=Object.entries(ex).filter(function(e){return e[1]>0;});
          if(!items.length)return'';
          return'<div style="margin:.4rem 0"><b>'+s.name+':</b> '+items.map(function(e){var exp=EXPENSES.find(function(x){return x.id===e[0];});return(exp?exp.label:e[0])+' ('+fmt(e[1])+')';}).join(' - ')+'</div>';
        }).join('')+
        '<br><b>Crisis reasoning:</b><br>'+
        Object.entries(row.crisis_call||{}).map(function(entry){var sid=entry[0],v=entry[1];var st=STARTUPS.find(function(x){return x.id===sid;});return'<div style="margin:.4rem 0"><b>'+(st?st.name:sid)+' - '+v.call+':</b> '+v.reason+'</div>';}).join('')+
        '</div></details></div>';
      });
    }
    app().innerHTML=html;
  } catch(e){app().innerHTML+='<div class="ibox" style="color:#DC2626">Error loading data: '+e.message+'</div>';}
}

function render(){
  var s=S.screen;
  if(s==='home')drawHome();
  else if(s==='register')drawRegister();
  else if(s==='brief')drawBrief();
  else if(s==='r1alloc')drawR1Alloc();
  else if(s==='r1detail')drawR1Detail();
  else if(s==='r2events')drawR2Events();
  else if(s==='r2adjust')drawR2Adjust();
  else if(s==='r3crisis')drawR3Crisis();
  else if(s==='done')drawDone();
  else if(s==='adminlogin')drawAdminLogin();
  else if(s==='admin')drawAdmin();
}
render();
</script>
</body>
</html>
